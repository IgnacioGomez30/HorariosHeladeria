<script>

const table = (heads, rows, caption = '') => '<div class="scroll" tabindex="0"><table>' + (caption ? '<caption>' + caption + '</caption>' : '') + '<thead><tr>' + heads.map(h => '<th scope="col">' + h + '</th>').join('') + '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map((x, i) => i ? '<td>' + x + '</td>' : '<th scope="row">' + x + '</th>').join('') + '</tr>').join('') + '</tbody></table></div>';
const navTo = path => {
  if (location.hash === '#' + path) render();else location.hash = path;

const isSafeInt = (x, min, max) => Number.isInteger(x) && x >= min && x <= max;

const current = () => draft || confirmed;
const key = (p, d) => p + '-' + d;
const dataLocks = () => draftLocks || locks;
function beginDraft(type) {
  draft = current().map(row => row.slice());
  draftLocks = new Set(dataLocks());

  manual = false;
  weekOffset = 0;
  undo = null;
}
function choose(type) {
  beginDraft(type);
  draft = fresh();
  draftLocks = new Set();
  if (type === 'cobertura') {
    draft[0][4] = 'Franco rotativo';
    draft[0][6] = '15:00–21:00';
    draft[1][4] = '12:00–19:00';
    draft[1][6] = 'Franco rotativo';
    draft[1][0] = '15:00–22:00';

  if (type === 'reparacion') {

}

}

  return current().map(row => row.slice());
}

  return '<nav class="views" aria-label="Vista de horarios">' + [['semana', 'Semana'], ['dia', 'Día'], ['mes', 'Mes']].map(([path, label]) => b(label, path, on === path ? 'selected' : '')).join('') + '</nav>';

  return new Date(Date.UTC(2030, 3, 1 + i));

  return dateAt(i).toLocaleDateString('es-AR', {

    month: 'long',

    timeZone: 'UTC'

}

  return html;
}
function cell(p, d) {
  selectedPerson = p;
  selectedDay = d;
  let value = current()[p][d];
  return back('Semana', 'semana') + hero('Detalle de jornada', names[p] + ' · ' + weekdays[d].toLowerCase() + ' ' + (d + 1), state()) + '<section class="panel slim"><h2>' + display(value) + '</h2>' + (value.includes('+1') ? '<p>El cierre ocurre el ' + weekdays[(d + 1) % 7].toLowerCase() + '. Todas las horas de esta jornada se asignan al ' + weekdays[d].toLowerCase() + '.</p>' : '') + (value.includes('|') ? '<p>6 horas de trabajo. Pausa entre las 16:00 y las 18:00.</p>' : '') + '<p>' + (dataLocks().has(key(p, d)) ? 'Asignación fijada.' : 'Asignación sin fijar.') + '</p></section>' + act(b('Ver el día', 'dia'), b(draft ? 'Editar borrador' : 'Crear revisión para editar', 'editar/' + p + '/' + d), b('Registrar solicitud', 'solicitudes'), b(dataLocks().has(key(p, d)) ? 'Revisar desbloqueo' : 'Fijar asignación', 'fijar/' + p + '/' + d));
}
function editCell(p, d) {
  let v = current()[p][d];
  let options = [v, ...(p === 3 ? ['Sin asignar'] : ['Sin asignar', 'Franco rotativo', 'Ausencia', '12:00–19:00'])];
  return back('Volver al detalle', 'celda/' + p + '/' + d) + hero('Edición manual', names[p] + ' · ' + weekdays[d].toLowerCase()) + (dataLocks().has(key(p, d)) ? note('La asignación está fijada. Revisá el bloqueo antes de editarla.', true) + b('Ver bloqueo', 'fijar/' + p + '/' + d) : '<div class="form panel"><label>Asignación de ejemplo<select id="newval">' + [...new Set(options)].map(v => '<option>' + v.replace('|', ' / ') + '</option>').join('') + '</select></label>' + note('Este editor ensaya el guardado de una celda. Los cambios manuales quedan en un borrador pendiente de validación.') + act(btn('Aplicar al borrador', 'edit-' + p + '-' + d, 'primary'), b('Cancelar', 'celda/' + p + '/' + d)) + '</div>');
}
function lockPage(p, d) {
  let locked = dataLocks().has(key(p, d));
  return back('Volver al detalle', 'celda/' + p + '/' + d) + hero('Protección de la asignación', (locked ? 'Desfijar' : 'Fijar') + ' · ' + names[p]) + '<p>' + weekdays[d] + ' ' + (d + 1) + ' de abril · ' + display(current()[p][d]) + '</p>' + note(locked ? 'Una futura propuesta podrá cambiar esta asignación.' : 'Al preparar propuestas, esta persona deberá conservar esta asignación.') + act(btn(locked ? 'Desfijar en borrador' : 'Fijar en borrador', 'lock-' + p + '-' + d, 'primary'), b('Cancelar', 'celda/' + p + '/' + d));

function parts(value) {
  if (!/^[0-9]/.test(value)) return [];

    let [a, c] = s.split('–');
    const minute = t => Number(t.slice(0, 2)) * 60 + Number(t.slice(3, 5));

}
function clock(m) {
  let n = m % 1440;

const openTimes = [[720, 1500], [900, 1440], [720, 1260], [720, 1500], [720, 1500], [720, 1500], [900, 1500]];
function day() {
  let d = selectedDay;

  }

        render();
      }
      break;
    case 'patron':
      showBlock();
      break;
    case 'vigencia':
      {
        let fecha = lookup('vig-fecha').value;
        lookup('vig-msg').textContent = fecha ? fecha > '2030-04-07' ? 'La regla empezaría después de la semana visible.' : 'La regla requiere revisar el período que incluye esa fecha. El confirmado se conserva.' : 'Elegí la fecha de comienzo.';
        break;
      }
    case 'reqrepair':
      request = true;
      navTo('comparar');
      break;
    case 'registrar':
      if (lookup('reqtype').value === 'ausencia') {
        request = true;
        navTo('solicitudes');
      }
      break;
    case 'commitment':
      commitment = true;
      render();
      break;
    case 'settings':
      settingsReviewed = true;
      render();
      break;
    case 'preview':
      lookup('export-view').innerHTML = '<h2>Contenido · ' + lookup('fmt').value + '</h2><p>1–7 de abril de 2030 · Revisión ' + revision + ' · Demostración</p>' + table(['Persona', ...shortDays], confirmed.map((row, i) => [names[i], ...row.map(x => x === 'Ausencia' ? 'Ausencia' : display(x))])) + '<p class="help">La maqueta se detiene antes de la escritura del archivo.</p>';
      break;
    case 'importpreview':
      lookup('file-msg').innerHTML = lookup('archivo').value === 'invalido' ? note('No se puede aplicar. El patrón menciona una persona desconocida. Revisá el archivo de origen.', true) : note('Ejemplo válido: nueva regla de apertura con vigencia desde el 15 de abril. Antes de aplicar se debe crear una copia verificada y confirmar el cambio.');
      break;
    case 'fileinfo':
      lookup('file-info').hidden = false;
      break;
  }
}
let pendingChoice = 'equilibrada';
pages.reemplazar = () => back('Semana', 'semana') + hero('Elegir propuesta', 'Ya hay un borrador') + note('Si elegís esta propuesta, se reemplazará el borrador de esta sesión. Las revisiones confirmadas seguirán disponibles.') + act(btn('Reemplazar borrador', 'replaceDraft', 'primary'), b('Conservar borrador', 'semana'));
main.addEventListener('click', e => {
  const target = e.target.closest('[data-act]');
  if (target) handle(target.dataset.act);
});
main.addEventListener('change', e => {
  if (e.target.id === 'dia-sel') {
    selectedDay = Number(e.target.value);
    render();
    lookup('dia-sel').focus();
  }
  if (e.target.id === 'mes-per') {
    selectedPerson = Number(e.target.value);
    render();
    lookup('mes-per').focus();
  }
  if (e.target.id === 'reqtype') {
    let t = e.target.value;
    lookup('req-info').textContent = t === 'ausencia' ? 'La ausencia es obligatoria y se descuenta de la disponibilidad real.' : t === 'civil' ? 'Cubre de 00:00 a 00:00 del día siguiente, incluso si la jornada previa termina esa madrugada.' : 'Se intenta conceder el franco cuando las demás reglas lo permiten.';
    main.querySelector('[data-act="registrar"]').disabled = t !== 'ausencia';
  }
});
lookup('saltar').addEventListener('click', e => {
  e.preventDefault();
  main.focus();
});
window.addEventListener('hashchange', render);
render();
</script></body></html>
