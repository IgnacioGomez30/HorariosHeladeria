[project]
name = "horarios-heladeria"
version = "0.1.0"
description = "Dominio de horarios y francos de la heladería"
requires-python = ">=3.12,<3.13"
dependencies = ["tzdata==2026.2"]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integracion"]
addopts = "--strict-markers"

[build-system]
requires = ["uv_build==0.13.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "heladeria"
